<!doctype html><meta charset="utf-8"><canvas id="c"></canvas>
<script type="module">
// pose sheet for the figure model: node tools/bench.mjs <outdir> figures
import { Impasto, Strokes, hex } from '../engine/impasto.js';
import { figure, crow } from '../film/actors.js';
const E = new Impasto(document.getElementById('c'), { W: 1080, H: 1920, ss: 2 });
const cam = { x: 540, y: 960, zoom: 1 };
const s = new Strokes(4096);
const ph = Number(new URLSearchParams(location.search).get('ph') || 0.15);
const coats = ['#4a4239', '#3e4a5a', '#6a4a32', '#4a3a3e', '#3e4638', '#5e4a3a'];
const big = new URLSearchParams(location.search).get('big');
if (big) {
  // the large figures of the film: the hero on the hill (S16/S17), the woman at the window (S05), the walker (S10)
  figure(s, { x: 230, y: 1800, h: 1150, facing: 'back', coat: hex('#3e3731'), seed: 1, collar: true, light: 1, belt: true, hands: false, pockets: true, sway: 0.4, collarLift: 0.7, look: 0.4, cheek: true, hem: 0.3 });
  figure(s, { x: 600, y: 1800, h: 1150, facing: 'front', coat: hex('#3f5266'), skin: hex('#b5856a'), hair: hex('#2a201c'), longHair: true, look: -0.6, tiltHead: -0.4, light: -1, collar: false, scarf: hex('#7a4a40'), armL: [0.25, 0.5], armR: [0.22, 2.05], seed: 41 });
  figure(s, { x: 900, y: 1800, h: 1000, facing: 'back', walk: 0.3, stride: 0.14, coat: hex('#4a4239'), lit: hex('#a8865a'), seed: 1, collar: true, light: 1, belt: true, armR: [0.48, 0.12], armL: [-0.08, 0.18] });
} else {
// row 1: walking back / front / right / left
figure(s, { x: 150, y: 620, h: 500, facing: 'back', walk: ph, coat: hex(coats[0]), seed: 1, light: 1 });
figure(s, { x: 410, y: 620, h: 500, facing: 'front', walk: ph + 0.25, coat: hex(coats[1]), seed: 2, light: 1, scarf: hex('#9C3B2A') });
figure(s, { x: 680, y: 620, h: 500, facing: 'right', walk: ph, coat: hex(coats[2]), seed: 3, light: 1 });
figure(s, { x: 940, y: 620, h: 500, facing: 'left', walk: ph + 0.5, coat: hex(coats[3]), seed: 4, light: 1 });
// row 2: standing with weight shift, hands in pockets, sitting, arm raised (umbrella grip), child
figure(s, { x: 140, y: 1240, h: 500, facing: 'front', sway: 1, coat: hex(coats[4]), seed: 5, light: -1 });
figure(s, { x: 380, y: 1240, h: 500, facing: 'back', sway: -1, pockets: true, coat: hex(coats[5]), seed: 6, light: 1 });
figure(s, { x: 620, y: 1240, h: 480, facing: 'front', sit: 0.3, coat: hex(coats[1]), seed: 7, light: 1, look: -1, armL: [0.12, 0.6], armR: [-0.12, 0.6] });
figure(s, { x: 860, y: 1240, h: 500, facing: 'front', coat: hex(coats[0]), seed: 8, light: -1, armR: [2.6, 0.5], look: 0.3 });
figure(s, { x: 1000, y: 1240, h: 330, facing: 'back', child: true, coat: hex('#8a5a3a'), seed: 9, light: 1, sway: 0.5 });
// row 3: a group seen from behind, close together
[[200, 300, '#5a3e2e', { pockets: true, sway: 1 }], [330, 290, '#3e4a5a', { sway: -1, armR: [0.35, 0.3] }], [440, 280, '#6a4a32', { armL: [-0.3, 0.25], sway: 0.5 }], [560, 300, '#4a3a3e', { pockets: true }],
 [680, 210, '#8a5a3a', { child: true, sway: -0.5 }], [800, 295, '#3e4638', { sway: 1, scarf: hex('#C0543F') }], [930, 285, '#5e4a3a', { pockets: true, sway: -1 }]].forEach(([x, h, c, q], i) =>
  figure(s, Object.assign({ x, y: 1860, h, facing: 'back', coat: hex(c), seed: 20 + i, light: 1 }, q)));
}
E.begin({ clear: hex('#d9b878') });
E.drawNow(s, { cam });
E.finish({ amb: 0.84, dif: 0.3, spec: 0.18, vig: 0 });
await fetch('/png?name=figures_' + (big ? 'big' : ph), { method: 'POST', body: E.readRGBA() });
window.__R = { strokes: s.count };
</script>
