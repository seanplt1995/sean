<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>极美 · 刮刀油画</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 14px/1.4 "Noto Serif SC", serif; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { height: 100vh; width: auto; max-width: 100vw; aspect-ratio: 9 / 16; background: #000; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 14px; background: rgba(0,0,0,.55); display: flex; gap: 10px; align-items: center; }
  #ui input[type=range] { flex: 1; }
  #ui button, #ui label { background: #2a2a2a; color: #ddd; border: 1px solid #444; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
  #info { min-width: 9em; text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="ui">
  <button id="play">▶</button>
  <input id="seek" type="range" min="0" max="211.63" step="0.01" value="0">
  <span id="info">0.00 s</span>
  <label>音频 <input id="file" type="file" accept="audio/*" hidden></label>
</div>
<script type="module">
let Film;
try { ({ Film } = await import('./film/film.js')); } catch (e) { window.__ERR = String(e.stack || e); throw e; }

const qs = new URLSearchParams(location.search);
const film = new Film(document.getElementById('c'));
window.__ERR = null;
window.addEventListener('error', (e) => { window.__ERR = String(e.message || e); });
window.addEventListener('unhandledrejection', (e) => { window.__ERR = String(e.reason && (e.reason.stack || e.reason)); });

try { await film.init(); } catch (e) { window.__ERR = String(e.stack || e); throw e; }

if (qs.has('still')) {
  // offline stills: ?still=t1,t2,…  → POST RGBA to /png?name=…
  document.getElementById('ui').remove();
  const times = qs.get('still').split(',').map(Number);
  for (const t of times) {
    const t0 = performance.now();
    const r = film.frame(t);
    const px = film.E.readRGBA();
    await fetch(`/png?name=${encodeURIComponent((qs.get('prefix') || 'f') + '_' + t.toFixed(2))}&ms=${Math.round(performance.now() - t0)}&shot=${r.shot}`, { method: 'POST', body: px });
  }
  window.__DONE = true;
} else if (qs.has('render')) {
  // offline frames: ?render=1&from=&to=&fps=24 → POST planar YUV420 to /frame
  document.getElementById('ui').remove();
  const fps = Number(qs.get('fps') || 24), f0 = Number(qs.get('f0') || 0), f1 = Number(qs.get('f1'));
  const buf = new Uint8Array(film.E.W * film.E.H * 3 / 2);
  for (let f = f0; f < f1; f++) {
    const t = f / fps;
    const r = film.frame(t);
    film.E.readYUV(buf);
    const res = await fetch(`/frame?f=${f}&shot=${r.shot}`, { method: 'POST', body: buf });
    if (!res.ok) throw new Error('sink: ' + await res.text());
  }
  window.__DONE = true;
} else {
  // interactive preview: plays the song (pick the file) and paints as fast as the GPU allows
  const audio = new Audio();
  if (qs.get('audio')) audio.src = qs.get('audio');
  document.getElementById('file').onchange = (e) => { audio.src = URL.createObjectURL(e.target.files[0]); };
  const seek = document.getElementById('seek'), info = document.getElementById('info'), play = document.getElementById('play');
  let t = Number(qs.get('t') || 0), playing = false, last = performance.now();
  play.onclick = () => { playing = !playing; play.textContent = playing ? '❚❚' : '▶'; if (audio.src) { audio.currentTime = t; playing ? audio.play() : audio.pause(); } last = performance.now(); };
  seek.oninput = () => { t = Number(seek.value); if (audio.src) audio.currentTime = t; };
  const loop = () => {
    const now = performance.now();
    if (playing) { t = audio.src && !audio.paused ? audio.currentTime : t + (now - last) / 1000; if (t > 211.6) { t = 0; } }
    last = now;
    const r = film.frame(t); film.E.show();
    seek.value = t; info.textContent = `${t.toFixed(2)} s · ${r.shot}`;
    requestAnimationFrame(loop);
  };
  loop();
}
</script>
</body>
</html>
