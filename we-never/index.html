const RP_DEFAULT = { decay: 0.6, zoom: 1.0, rot: 0.0, bloom: 1.0, thresh: 0.5, exposure: 1.4, ca: 0.002, caKick: 0.006,

for (const a of ACTS) { a.rp = Object.assign({}, RP_DEFAULT, a.rp); a.bgc = hex(a.bg); a.palc = a.pal.map(hex); }
const KEY_T = { DROP1: 15.04, DROP2: 59.57 };
const BURSTS = [{ t: 15.04, amp: 3.2 }, { t: 59.57, amp: 3.0 }];

/* ─────────────────────────── math helpers ─────────────────────────── */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOutCubic = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeInOut = (t) => { t = clamp(t, 0, 1); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const fmtTime = (t) => { t = Math.max(0, t); const m = Math.floor(t / 60); const s = t - m * 60; return `${String(m).padStart(2, '0')}:${s.toFixed(2).padStart(5, '0')}`; };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const v3 = { sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  scale: (a, s) => [a[0] * s, a[1] * s, a[2] * s], dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
  lerp: (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)] };

function lookAt(eye, tgt, up, roll) {
  const f = v3.norm(v3.sub(tgt, eye));
  let r = v3.norm(v3.cross(f, up));
  let u = v3.cross(r, f);
  if (roll) { const c = Math.cos(roll), s = Math.sin(roll); const r2 = v3.add(v3.scale(r, c), v3.scale(u, s)); u = v3.add(v3.scale(u, c), v3.scale(r, -s)); r = r2; }
  const view = new Float32Array([r[0], u[0], -f[0], 0, r[1], u[1], -f[1], 0, r[2], u[2], -f[2], 0,
    -v3.dot(r, eye), -v3.dot(u, eye), v3.dot(f, eye), 1]);
  const rot = new Float32Array([r[0], r[1], r[2], u[0], u[1], u[2], -f[0], -f[1], -f[2]]); // camera→world (columns)
  return { view, rot, fwd: f };
}
function perspective(fovDeg, aspect, near, far, shiftY) {
  const f = 1 / Math.tan(fovDeg * Math.PI / 360);
  return new Float32Array([f / aspect, 0, 0, 0, 0, f, 0, 0, 0, -shiftY, (far + near) / (near - far), -1, 0, 0, 2 * far * near / (near - far), 0]);
}
function mulMat4Vec(m, v) { return [m[0] * v[0] + m[4] * v[1] + m[8] * v[2] + m[12] * v[3], m[1] * v[0] + m[5] * v[1] + m[9] * v[2] + m[13] * v[3], m[2] * v[0] + m[6] * v[1] + m[10] * v[2] + m[14] * v[3], m[3] * v[0] + m[7] * v[1] + m[11] * v[2] + m[15] * v[3]]; }

/* ════════════════════════════════ GLSL ════════════════════════════════ */
const GLSL_COMMON = `
#define PI 3.14159265359
#define TAU 6.28318530718
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+10.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
// 3D simplex noise with analytic gradient (Gustavson / McEwan)
float snoiseG(vec3 v, out vec3 grad){
  const vec2 C=vec2(1.0/6.0,1.0/3.0);
  const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);
  vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.yyy;
  vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);
  vec4 y_=floor(j-7.0*x_);
  vec4 xx=x_*ns.x+ns.yyyy;
  vec4 yy=y_*ns.x+ns.yyyy;
  vec4 h=1.0-abs(xx)-abs(yy);
  vec4 b0=vec4(xx.xy,yy.xy);
  vec4 b1=vec4(xx.zw,yy.zw);
  vec4 s0=floor(b0)*2.0+1.0;
  vec4 s1=floor(b1)*2.0+1.0;
  vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);
  vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z);
  vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.5-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
  vec4 m2=m*m;
  vec4 m4=m2*m2;
  vec4 pdotx=vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3));
  vec4 temp=m2*m*pdotx;
  grad=-8.0*(temp.x*x0+temp.y*x1+temp.z*x2+temp.w*x3);
  grad+=m4.x*p0+m4.y*p1+m4.z*p2+m4.w*p3;
  grad*=105.0;
  return 105.0*dot(m4,pdotx);
}
float snoise(vec3 v){ vec3 g; return snoiseG(v,g); }
// divergence-free curl noise (Bridson): curl of a 3-component simplex potential
vec3 curl(vec3 p){
  vec3 g1,g2,g3;
  snoiseG(p,g1);
  snoiseG(p+vec3(31.341,-43.123,17.31),g2);
  snoiseG(p+vec3(-61.17,23.73,-89.11),g3);
  return vec3(g3.y-g2.z, g1.z-g3.x, g2.x-g1.y);
}
float fbm(vec3 p){ float a=0.5, s=0.0; for(int i=0;i<4;i++){ s+=a*snoise(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=0.5; } return s; }
vec3 h33(vec3 p3){ p3=fract(p3*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yxz+33.33); return fract((p3.xxy+p3.yxx)*p3.zyx); }
float h12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec3 sphereDir(vec2 r){ float z=r.x*2.0-1.0; float a=r.y*TAU; float s=sqrt(max(0.0,1.0-z*z)); return vec3(s*cos(a),s*sin(a),z); }
vec3 rotX(vec3 p,float a){ float c=cos(a),s=sin(a); return vec3(p.x,c*p.y-s*p.z,s*p.y+c*p.z); }
vec3 rotY(vec3 p,float a){ float c=cos(a),s=sin(a); return vec3(c*p.x+s*p.z,p.y,-s*p.x+c*p.z); }
vec3 rotZ(vec3 p,float a){ float c=cos(a),s=sin(a); return vec3(c*p.x-s*p.y,s*p.x+c*p.y,p.z); }
float gyroid(vec3 q){ return sin(q.x)*cos(q.y)+sin(q.y)*cos(q.z)+sin(q.z)*cos(q.x); }
vec3 gyroidGrad(vec3 q){ return vec3(cos(q.x)*cos(q.y)-sin(q.z)*sin(q.x), -sin(q.x)*sin(q.y)+cos(q.y)*cos(q.z), -sin(q.y)*sin(q.z)+cos(q.z)*cos(q.x)); }
`;

const VS_QUAD = `#version 300 es
out vec2 vUv;
void main(){ vec2 p=vec2(float((gl_VertexID<<1)&2), float(gl_VertexID&2)); vUv=p; gl_Position=vec4(p*2.0-1.0,0.0,1.0); }`;

/* ── particle physics: one MRT pass writes position / velocity / aux ── */
const FS_SIM = (mode) => `#version 300 es
#define MODE ${mode}
precision highp float;
precision highp int;
precision highp sampler2D;
uniform sampler2D uPos, uVel, uAux, uSeed, uLorenz;
uniform float uTime, uDt, uLocal, uEnter, uSim;
uniform float uBass, uMid, uHigh;
uniform float uKickAge, uKickAmp, uKickEvent;
uniform float uHiAge, uHiEvent, uHiCount;
uniform vec4 uRipple;            // xy centre, z age, w amp
uniform float uBurst;
uniform vec3 uCamPos;
uniform float uTunnelZ;
layout(location=0) out vec4 oPos;
layout(location=1) out vec4 oVel;
layout(location=2) out vec4 oAux;
${GLSL_COMMON}
const float LS = 0.028;          // Lorenz → world scale
const float GP = 0.55;           // gyroid period (world units)

vec3 spring(vec3 p, vec3 v, vec3 T, float k, float z){
  k = min(k, 0.22/(uDt*uDt));
  return (T-p)*k - v*(2.0*sqrt(k)*z);
}
vec3 klein(float u, float v){
  float cu=cos(u), su=sin(u), cv=cos(v), sv=sin(v);
  float cu2=cu*cu, cu3=cu2*cu, cu4=cu2*cu2, cu5=cu4*cu, cu6=cu4*cu2, cu7=cu6*cu;
  float x=-2.0/15.0*cu*(3.0*cv-30.0*su+90.0*cu4*su-60.0*cu6*su+5.0*cu*cv*su);
  float y=-1.0/15.0*su*(3.0*cv-3.0*cu2*cv-48.0*cu4*cv+48.0*cu6*cv-60.0*su+5.0*cu*cv*su-5.0*cu3*cv*su-80.0*cu5*cv*su+80.0*cu7*cv*su);
  float z=2.0/15.0*(3.0+5.0*cu*su)*sv;
  return vec3(x-0.15, y-2.1, z);
}
vec4 rot4(vec4 p, float axy, float axw, float ayw, float azw){
  float c=cos(axy), s=sin(axy); p.xy=mat2(c,s,-s,c)*p.xy;
  c=cos(axw); s=sin(axw); p.xw=mat2(c,s,-s,c)*p.xw;
  c=cos(ayw); s=sin(ayw); p.yw=mat2(c,s,-s,c)*p.yw;
  c=cos(azw); s=sin(azw); p.zw=mat2(c,s,-s,c)*p.zw;
  return p;
}
vec3 tesseract(vec4 S, vec3 R, float t){
  vec4 q;
  if (R.x < 0.7) {                         // 32 edges of the 4-cube
    float e=floor(S.x*32.0); float d=floor(e/8.0); float c=mod(e,8.0);
    vec3 b=vec3(mod(c,2.0), mod(floor(c*0.5),2.0), floor(c*0.25))*2.0-1.0;
    float s=S.y*2.0-1.0;
    q = d<0.5 ? vec4(s,b) : d<1.5 ? vec4(b.x,s,b.yz) : d<2.5 ? vec4(b.xy,s,b.z) : vec4(b,s);
    q += (vec4(R.yz,S.zw)-0.5)*0.045;
  } else {                                 // 24 square faces, hatched
    float f=floor(S.x*24.0); float pr=floor(f/4.0); float sg=mod(f,4.0);
    vec2 b=vec2(mod(sg,2.0), floor(sg*0.5))*2.0-1.0;
    float u=S.y*2.0-1.0;
    float w=(floor(R.y*7.0)/6.0)*2.0-1.0;
    if (pr<0.5) q=vec4(u,w,b); else if (pr<1.5) q=vec4(u,b.x,w,b.y); else if (pr<2.5) q=vec4(u,b,w);
    else if (pr<3.5) q=vec4(b.x,u,w,b.y); else if (pr<4.5) q=vec4(b.x,u,b.y,w); else q=vec4(b,u,w);
  }
  q = rot4(q, t*0.19, t*0.43, t*0.31, t*0.17);
  return q.xyz * (1.0/(2.9-q.w));
}
// thin event-horizon ring the collapsed grains expand into just before each drop
vec3 haloRing(vec4 S, vec3 R, float k){
  float a = S.x*TAU;
  float r = mix(0.025, 0.36, k)*(1.0 + 0.02*(R.y - 0.5));
  return vec3(cos(a)*r, sin(a)*r, (R.z - 0.5)*0.012);
}
vec3 projGyroid(vec3 w, float off){
  vec3 q = w*(TAU/GP);
  for (int i=0;i<3;i++){ float f=gyroid(q)-off; vec3 g=gyroidGrad(q); q -= f*g/max(dot(g,g),0.25); }
  return q*(GP/TAU);
}

void main(){

#if MODE == 0

    }

    vec3 d = p - C0; float r = length(d); vec3 n = d/max(r,1e-4);

    vec3 away = normalize(n*n.y - vec3(0.0,1.0,0.0) + vec3(1e-5));    // tangent pointing away from the pole
    acc += -n*1.25*onS;                                                   // adhesion (Coanda sheet)

    vec3 cn = curl(p*3.2 + vec3(0.0, uTime*0.12, 0.0)); cn -= n*dot(cn,n);

    bright = 1.0 + g*3.5 + (1.0-onS)*0.35*smoothstep(0.5,1.5,p.y);

  }
#elif MODE == 1
  {
    /* ── ACT II · reversed gravity → fractal Klein hourglass → singularity → event-horizon ring ── */

      else if (R.x < 0.8) { lat = (floor(S.x*9.0)+0.5)/9.0*PI; lon = S.y*TAU; }
      else { lon = (floor(S.x*42.0) + step(0.5, R.y)*0.5)/42.0*TAU; lat = (floor(S.y*5.0) + 0.25 + 0.5*R.z)/5.0*PI; }
      vec3 dsh = vec3(sin(lat)*cos(lon), cos(lat), sin(lat)*sin(lon));
      float rr = (0.74 + 0.045*snoise(dsh*3.0 + t*0.25))*(1.0 + 0.06*uKickAmp*exp(-uKickAge*5.0));
      vec3 Tsh = rotY(rotX(dsh*rr, 0.42), -t*0.32);
      float s = S.y*TAU;
      float kr = 0.56 + 0.17*cos(7.0*s);
      vec3 knot = vec3(kr*cos(3.0*s), 0.24*sin(7.0*s), kr*sin(3.0*s));
      vec3 tng = normalize(vec3(-3.0*kr*sin(3.0*s), 1.68*cos(7.0*s), 3.0*kr*cos(3.0*s)));
      vec3 bn = normalize(cross(tng, vec3(0.0,1.0,0.0)) + 1e-4);
      vec3 nm = cross(bn, tng);
      float ta = R.y*TAU;
      knot += (bn*cos(ta) + nm*sin(ta))*0.045*sqrt(R.z);
      knot = rotY(rotX(knot, 0.5), -t*0.45);
      float km = smoothstep(7.9, 9.2, lt);
      vec3 T = mix(Tsh, knot*1.08, km);
      acc += spring(p, v, T, 34.0, 0.55);
      cmix = 0.62 + 0.38*R.z;
      bright = 1.8 + 0.8*step(0.8, R.x);
    } else {
      extra += dt;
      if (uKickEvent > 0.5 && extra > 0.55 && R.z < 0.6) {
        vec3 cp = tesseract(S, R, t)*0.3;
        p = cp;
        vec3 dir = normalize(cp + sphereDir(R.xy)*0.35);
        v = dir*(1.6 + 2.8*S.y*uKickAmp) + vec3(0.0, 0.4, 0.0);
        extra = 0.0;
      }
      acc += vec3(0.0, -1.35, 0.0);
      drag = 0.85;
      alpha = exp(-extra*1.9);
      cmix = 0.12 + 0.2*extra;
      bright = 3.2;
      size = 1.1;
    }
  }
#elif MODE == 6
  {
    /* ── ACT VII · phyllotaxis mandala dome tunnel (golden angle 137.5°) ── */
    float lt = uLocal;
    float NL = 8.0;
    float idx = float(ij.y)*uSim + float(ij.x);
    float layer = mod(idx, NL);
    float i = floor(idx/NL);
    float nper = uSim*uSim/NL;
    float depth = 6.6;
    float zz = mod(layer/NL*depth + uTunnelZ, depth);
    float dirL = mod(layer, 2.0) < 0.5 ? 1.0 : -1.0;
    float spin = layer*0.41 + dirL*uTime*0.24;
    float role = mod(i, 10.0);
    float th, r;
    if (role < 1.5) {                       // tracery rings
      float ring = floor(R.x*3.0);
      th = S.y*TAU + spin; r = 0.32 + ring*0.46 + 0.006*(R.y - 0.5);
    } else if (role < 2.5) {                // 12 radial mullions
      th = floor(S.y*12.0)/12.0*TAU + spin + 0.004*(R.y - 0.5); r = 0.12 + 1.4*S.x;
    } else {                                // golden-angle phyllotaxis fill
      th = i*2.39996323 + spin;
      r = 0.1 + 1.45*sqrt(i/nper);
    }
    r *= 1.0 + 0.11*cos(6.0*th + layer) + 0.05*uBass*exp(-uKickAge*5.0);
    float z = -depth + zz + 0.32*r*r - 0.35;
    vec3 T = vec3(r*cos(th), r*sin(th), z);
    if (length(T-p) > 1.2 && lt > 1.6) { p = T; v = vec3(0.0); }
    acc += spring(p, v, T, mix(10.0, 46.0, smoothstep(0.0, 1.5, lt)), 0.75);
    acc += curl(p*1.8 + uTime*0.2)*0.08;
    drag = 0.2;
    alpha = smoothstep(0.0, 1.4, zz)*(1.0 - smoothstep(depth-0.9, depth-0.2, zz));
    cmix = fract(layer/NL + r*0.22 + uTime*0.03);
    bright = (role < 2.5 ? 1.5 : 0.85) + 0.5*pow(abs(cos(3.0*th)), 8.0);
  }
#else
  {
    /* ── ACT VIII · embers drifting down to the void ── */
    float lt = uLocal;
    acc += vec3(0.0, -0.2, 0.0);
    acc += curl(p*1.4 + vec3(0.0, uTime*0.05, 0.0))*0.11;
    drag = 1.5;
    float te = 1.8 + pow(S.x, 0.8)*10.9;
    alpha = 1.0 - smoothstep(te - 1.4, te, lt);
    alpha *= 0.62 + 0.38*sin(uTime*(1.5 + S.y*3.5) + S.z*TAU);
    cmix = 0.15 + 0.85*R.x;
    bool fly = R.z > 0.9;
    bright = fly ? 4.0 : 0.8 + 0.5*R.y;
    size = fly ? 1.5 : 1.0;
  }
#endif

#if MODE == 2 || MODE == 5
  bright *= 0.12 + 0.88*smoothstep(0.0, 0.8, uLocal);       // the detonation itself must not white out the frame
#endif
  v += acc*dt;
  v *= exp(-drag*dt);
  float sp = length(v); if (sp > 6.0) v *= 6.0/sp;
  p += v*dt;
  if (any(isnan(p)) || any(isinf(p)) || any(isnan(v))) { p = vec3(0.0, -4.0, 0.0); v = vec3(0.0); }
  oPos = vec4(p, life);
  oVel = vec4(v, extra);
  oAux = vec4(clamp(alpha, 0.0, 1.0), bright, clamp(cmix, 0.0, 1.0), size);
}`;

/* ── particle sprites ── */
const VS_PART = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
uniform sampler2D uPos, uVel, uAux, uSeed, uRD;
uniform mat4 uView, uProj;
uniform float uSim, uPointScale, uFocus, uAperture, uBright, uTime, uResScale;
uniform float uIrid, uRDMix, uHeat, uHue;
uniform vec3 uPal[4];
uniform vec3 uCamPos;
out vec3 vCol;
${GLSL_COMMON}
vec3 grad4(float x){
  x = clamp(x,0.0,1.0)*3.0;
  return x < 1.0 ? mix(uPal[0],uPal[1],x) : x < 2.0 ? mix(uPal[1],uPal[2],x-1.0) : mix(uPal[2],uPal[3],x-2.0);
}
vec3 hueRot(vec3 c, float a){ const vec3 k = vec3(0.57735); float ca = cos(a); return c*ca + cross(k, c)*sin(a) + k*dot(k, c)*(1.0 - ca); }
vec3 thinFilm(float cosT, float d){
  float n = 1.38;
  float sinT = sqrt(max(0.0, 1.0-cosT*cosT));
  float cosTt = sqrt(max(0.0, 1.0-(sinT/n)*(sinT/n)));
  float opd = 2.0*n*d*cosTt;
  return 0.5 + 0.5*cos(TAU*opd/vec3(650.0, 532.0, 450.0));
}
void main(){
  int sim = int(uSim);
  ivec2 ij = ivec2(gl_VertexID % sim, gl_VertexID / sim);
  vec4 P = texelFetch(uPos, ij, 0), V = texelFetch(uVel, ij, 0), A = texelFetch(uAux, ij, 0), S = texelFetch(uSeed, ij, 0);
  vec4 vp = uView*vec4(P.xyz, 1.0);
  gl_Position = uProj*vp;
  float dist = -vp.z;
  if (A.x < 0.003 || dist < 0.03) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); gl_PointSize = 1.0; vCol = vec3(0.0); return; }
  float fl = max(1.0, uProj[1][1]*0.42);            // telephoto shots keep their grain size
  float s0 = uPointScale*uResScale*A.w*(0.65 + 0.7*S.z*S.z)*fl/dist;
  float coc = uAperture*uResScale*fl*abs(dist - uFocus)/dist;
  float size = sqrt(s0*s0 + coc*coc);
  float cover = min(1.0, size*size);              // sub-pixel grains keep their energy, not their size
  size = clamp(size, 1.0, 64.0);
  gl_PointSize = size;
  float speed = length(V.xyz);
  vec3 col = grad4(A.z);
  vec3 rdv = texture(uRD, P.xy*0.42 + vec2(0.5, 0.5 + P.z*0.18)).rgb;
  float rd = smoothstep(0.12, 0.34, rdv.g);
  col = mix(col, grad4(fract(A.z + 0.5)), rd*uRDMix);
  vec3 vd = normalize(uCamPos - P.xyz);
  float cosT = abs(dot(normalize(V.xyz + vec3(1e-4)), vd));
  vec3 film = thinFilm(cosT, 280.0 + 520.0*fract(S.w*3.7 + P.y*0.4 + uTime*0.03));
  col = mix(col, col*film*2.1 + film*0.12, uIrid);
  col = max(hueRot(col, uHue*(0.4 + 1.2*S.w)), 0.0);                 // mid-band driven hue drift
  col = mix(col, vec3(1.0, 0.94, 0.84), smoothstep(1.4, 4.2, speed)*uHeat);
  float e = uBright*A.x*A.y*(0.55 + 0.9*S.w)*(1.0 + rd*uRDMix*0.6)*cover*(2.2/(size*size));
  vCol = col*e;
}`;
const FS_PART = `#version 300 es
precision highp float;
in vec3 vCol;
out vec4 o;
void main(){
  vec2 c = gl_PointCoord*2.0-1.0;
  float r2 = dot(c,c);
  if (r2 > 1.0) discard;
  o = vec4(vCol*exp(-r2*2.6), 1.0);
}`;

/* ── HDR feedback trails ── */
const FS_TRAIL = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uPrev;
uniform float uDecay, uZoom, uRot, uAspect;
uniform vec2 uC;
out vec4 o;
void main(){
  vec3 col;
  if (uZoom == 1.0 && uRot == 0.0) col = texelFetch(uPrev, ivec2(gl_FragCoord.xy), 0).rgb;
  else {
    vec2 q = (vUv - uC)*vec2(uAspect, 1.0);
    float c = cos(uRot), s = sin(uRot);
    q = mat2(c, s, -s, c)*q*uZoom;
    col = texture(uPrev, uC + q/vec2(uAspect, 1.0)).rgb;
    col *= 1.0 - 0.6*smoothstep(0.3, 0.62, length(q));     // zoom-feedback streaks must not pile up at the frame edge
  }
  col = any(isnan(col)) ? vec3(0.0) : min(col, vec3(48.0));
  o = vec4(col*uDecay, 1.0);
}`;

/* ── Gray-Scott reaction-diffusion ── */
const FS_RD = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uSrc;
uniform vec2 uTexel;
uniform float uFeed, uKill;
uniform vec4 uInject;
out vec4 o;
#define F(dx,dy) texelFetch(uSrc, (pc + ivec2(dx,dy) + sz) % sz, 0).xy
void main(){
  ivec2 sz = textureSize(uSrc, 0), pc = ivec2(gl_FragCoord.xy);
  vec2 c = F(0,0);
  vec2 lap = -c;
  lap += 0.2*(F(1,0) + F(-1,0) + F(0,1) + F(0,-1));
  lap += 0.05*(F(1,1) + F(-1,-1) + F(1,-1) + F(-1,1));
  float a = c.x, b = c.y;
  float abb = a*b*b;
  a += 1.0*lap.x - abb + uFeed*(1.0-a);
  b += 0.5*lap.y + abb - (uKill+uFeed)*b;
  vec2 dd = abs(vUv - uInject.xy); dd = min(dd, 1.0-dd);
  if (uInject.w > 0.0 && length(dd) < uInject.z) b = 0.85;
  o = vec4(clamp(a,0.0,1.0), clamp(b,0.0,1.0), 0.0, 1.0);
}`;

/* ── background: domain-warped FBM nebula, RD veins, raymarched gyroid glow, stars ── */
const FS_BG = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
uniform sampler2D uRD;
uniform vec3 uBg, uPal[4];
uniform mat3 uCamRot;
uniform vec3 uCamPos;
uniform float uTanHalf, uAspect, uShift, uTime, uBass, uMid, uKick;
uniform float uNebula, uRDW, uGyroid, uStars, uMarch0;
out vec4 o;
${GLSL_COMMON}
void main(){
  vec2 ndc = vUv*2.0 - 1.0;
  ndc.y -= uShift;
  vec3 rd = normalize(uCamRot*vec3(ndc.x*uTanHalf*uAspect, ndc.y*uTanHalf, -1.0));
  vec3 col = uBg;
  if (uNebula > 0.0) {
    vec3 q = rd*1.9 + vec3(0.0, uTime*0.012, uTime*0.02);
    vec3 w1 = vec3(fbm(q + vec3(1.7, 9.2, 0.0)), fbm(q + vec3(8.3, 2.8, 4.1)), fbm(q + vec3(3.1, 5.5, 7.7)));
    float f = fbm(q + 1.7*w1 + 0.08*uMid);
    float m = smoothstep(-0.15, 0.75, f);
    vec3 neb = mix(uPal[0], uPal[2], smoothstep(0.1, 0.8, w1.x*0.5 + 0.5));
    col += neb*m*m*(0.03 + 0.02*uBass)*uNebula;
    col += uPal[1]*pow(max(f, 0.0), 4.0)*0.035*uNebula;
  }
  if (uRDW > 0.0) {
    vec2 ruv = vec2(atan(rd.x, -rd.z)/TAU*2.0, rd.y*0.75 + 0.5);
    ruv += 0.03*vec2(snoise(rd*3.0 + uTime*0.05), snoise(rd*3.0 + 7.0));
    float b = texture(uRD, ruv).g;
    float vein = smoothstep(0.16, 0.24, b) - smoothstep(0.24, 0.36, b);
    col += mix(uPal[1], uPal[3], b*2.0)*vein*0.03*uRDW*(0.7 + 0.6*uKick);
  }
  if (uGyroid > 0.0) {
    float gk = TAU/0.55;
    float acc = 0.0, accB = 0.0;
    float t = uMarch0;
    for (int i = 0; i < 30; i++) {
      vec3 p = uCamPos + rd*t;
      float g = gyroid(p*gk);
      float sh = abs(abs(g) - 0.42);
      float wgt = exp(-sh*7.0)*step(length(p), 1.1);
      acc += wgt;
      accB += wgt*step(0.0, g);
      t += 0.16 + 0.012*float(i);
    }
    vec3 gc = mix(uPal[0], uPal[1], accB/max(acc, 1e-3));
    col += gc*acc*0.0065*uGyroid*(0.8 + 0.6*uBass);
  }
  if (uStars > 0.0) {
    vec3 sd = rd*170.0;
    vec3 cell = floor(sd);
    vec3 hh = h33(cell);
    vec3 sp = cell + 0.25 + 0.5*hh;
    float d = length(sd - sp);
    float star = (1.0 - smoothstep(0.0, 0.3, d))*step(0.982, hh.x);
    col += mix(uPal[3], vec3(1.0), 0.5)*star*(0.35 + 0.65*hh.y)*uStars*(0.6 + 0.4*sin(uTime*(1.0 + hh.z*3.0) + hh.y*20.0));
  }
  o = vec4(col, 1.0);
}`;

/* ── dual-filter bloom ── */
const FS_DOWN = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uSrc;
uniform vec2 uTexel;
uniform float uThreshold, uFirst;
out vec4 o;
void main(){
  vec2 t = uTexel;
  vec3 col = texture(uSrc, vUv).rgb*4.0;
  col += texture(uSrc, vUv - t).rgb + texture(uSrc, vUv + t).rgb + texture(uSrc, vUv + vec2(t.x, -t.y)).rgb + texture(uSrc, vUv - vec2(t.x, -t.y)).rgb;
  col *= 0.125;
  if (uFirst > 0.5) {
    col = any(isnan(col)) ? vec3(0.0) : min(col, vec3(64.0));
    float br = max(col.r, max(col.g, col.b));
    float soft = clamp(br - uThreshold + 0.25, 0.0, 0.5); soft = soft*soft*2.0;
    col *= max(soft, br - uThreshold)/max(br, 1e-4);
    col = min(col, vec3(40.0));
  }
  o = vec4(col, 1.0);
}`;
const FS_UP = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uSrc, uBgTex;
uniform vec2 uTexel;
uniform float uScale, uAddBg;
out vec4 o;
void main(){
  vec2 t = uTexel*0.5;
  vec3 c = texture(uSrc, vUv + vec2(-t.x*2.0, 0.0)).rgb + texture(uSrc, vUv + vec2(t.x*2.0, 0.0)).rgb
         + texture(uSrc, vUv + vec2(0.0, t.y*2.0)).rgb + texture(uSrc, vUv + vec2(0.0, -t.y*2.0)).rgb;
  c += (texture(uSrc, vUv + t).rgb + texture(uSrc, vUv - t).rgb + texture(uSrc, vUv + vec2(t.x, -t.y)).rgb + texture(uSrc, vUv + vec2(-t.x, t.y)).rgb)*2.0;
  o = vec4(c/12.0*uScale + (uAddBg > 0.5 ? texture(uBgTex, vUv).rgb : vec3(0.0)), 1.0);
}`;

/* ── final composite ── */
const FS_COMP = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uScene, uBloom, uBgTex, uHud;
uniform float uAspect, uTime, uKaleido, uFolds, uKAngle, uCA, uBloomStr, uExposure, uGrain, uVignette, uFade, uFlash, uHudOn, uHudAlpha;
uniform float uSing; uniform vec2 uSingUV; uniform vec3 uSingCol;
uniform vec2 uFocusUV; uniform vec2 uRes;
out vec4 o;
float h12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 kaleido(vec2 uv){
  vec2 p = (uv - uFocusUV)*vec2(uAspect, 1.0);
  float r = length(p);
  float a = atan(p.y, p.x) + uKAngle;
  float seg = 6.28318530718/uFolds;
  a = mod(a, seg); a = min(a, seg - a);
  a -= uKAngle*0.35;
  return uFocusUV + vec2(cos(a), sin(a))*r/vec2(uAspect, 1.0);
}
vec3 sampleAll(vec2 uv){
  vec2 off = (uv - uFocusUV)*uCA;
  vec3 sc;
  sc.r = texture(uScene, uv + off).r; sc.g = texture(uScene, uv).g; sc.b = texture(uScene, uv - off).b;
  sc = any(isnan(sc)) ? vec3(0.0) : min(sc, vec3(64.0));
  return sc + texture(uBloom, uv + off*0.5).rgb;
}
vec3 sampleFast(){
  ivec2 pc = ivec2(gl_FragCoord.xy), mx = ivec2(uRes) - 1;
  ivec2 o = ivec2(round((vUv - uFocusUV)*uCA*uRes));
  vec3 sc;
  sc.r = texelFetch(uScene, clamp(pc + o, ivec2(0), mx), 0).r;
  sc.g = texelFetch(uScene, pc, 0).g;
  sc.b = texelFetch(uScene, clamp(pc - o, ivec2(0), mx), 0).b;
  sc = any(isnan(sc)) ? vec3(0.0) : min(sc, vec3(64.0));
  return sc + texture(uBloom, vUv).rgb;
}
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
void main(){
  vec2 uv = vUv;
  vec3 col;
  if (uKaleido <= 0.001) col = sampleFast();
  else if (uKaleido >= 0.999) col = sampleAll(kaleido(uv));
  else col = mix(sampleAll(uv), sampleAll(kaleido(uv)), uKaleido);
  if (uSing > 0.0) {
    vec2 d = (uv - uSingUV)*vec2(uAspect, 1.0);
    float r2 = dot(d, d);
    float core = exp(-r2*2600.0) + 0.0006/(r2 + 0.0006)*0.3;
    float streak = exp(-abs(d.y)*900.0)*exp(-abs(d.x)*2.2);
    col += uSingCol*uSing*(core*2.2 + streak*1.1);
  }
  vec2 fq = (vUv - uFocusUV)*vec2(uAspect, 1.0);
  col += uFlash*vec3(1.0, 0.97, 0.92)*exp(-dot(fq, fq)*5.0);
  col = any(isnan(col)) ? vec3(0.0) : col;
  col *= uExposure;
  col = aces(col);
  col = pow(col, vec3(1.0/2.2));
  vec2 vq = (vUv - uFocusUV)*vec2(uAspect, 1.0);
  col *= 1.0 - uVignette*smoothstep(0.35, 1.05, length(vq)*1.25);
  float gr = h12(vUv*uRes + fract(uTime*7.31)*vec2(113.0, 271.0)) - 0.5;
  col += gr*uGrain*(0.6 + 0.4*(1.0 - dot(col, vec3(0.333))));
  col *= uFade;
  if (uHudOn > 0.5) { vec4 hd = texelFetch(uHud, ivec2(gl_FragCoord.xy), 0); col = mix(col, hd.rgb, hd.a*uHudAlpha); }
  o = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

/* ── offline export: RGB → planar YUV 4:2:0 (BT.709 limited) packed 4 samples per RGBA8 texel ── */
const FS_YUV = `#version 300 es
precision highp float;
precision highp int;
uniform sampler2D uSrc;
uniform ivec2 uSize;
out vec4 o;
vec3 px(ivec2 p){ return texelFetch(uSrc, ivec2(p.x, uSize.y - 1 - p.y), 0).rgb; }   // top-down image coordinates
float Y(vec3 c){ return (16.0 + 219.0*dot(c, vec3(0.2126, 0.7152, 0.0722)))/255.0; }
vec2 UV(ivec2 q){
  vec3 c = (px(q*2) + px(q*2 + ivec2(1,0)) + px(q*2 + ivec2(0,1)) + px(q*2 + ivec2(1,1)))*0.25;
  return (128.0 + 224.0*vec2(dot(c, vec3(-0.1146, -0.3854, 0.5)), dot(c, vec3(0.5, -0.4542, -0.0458))))/255.0;
}
void main(){
  ivec2 t = ivec2(gl_FragCoord.xy);
  int W = uSize.x, H = uSize.y, qw = W/4;
  if (t.y < H) { ivec2 p = ivec2(t.x*4, t.y); o = vec4(Y(px(p)), Y(px(p + ivec2(1,0))), Y(px(p + ivec2(2,0))), Y(px(p + ivec2(3,0)))); return; }
  int r = t.y - H;
  bool isV = r >= H/4;
  if (isV) r -= H/4;
  int base = (r*qw + t.x)*4, cw = W/2;
  vec4 res;
  for (int k = 0; k < 4; k++) { int i = base + k; vec2 uv = UV(ivec2(i % cw, i / cw)); res[k] = isV ? uv.y : uv.x; }

function accent(st) { const a = st.pal[1].map((x) => Math.round(Math.pow(x, 1 / 2.2) * 255)); return (al) => `rgba(${a[0]},${a[1]},${a[2]},${al})`; }
function hudHeader(c, t, st) {
  const { s, m, W } = HUD, accS = accent(st);
  c.textBaseline = 'alphabetic'; c.textAlign = 'left';
  c.font = `400 ${20 * s}px ${MONO}`; c.fillStyle = ink(0.86);
  c.fillText(`[FREQ: ${BPM.toFixed(1)} BPM // PHASE ${String(st.i + 1).padStart(2, '0')}]`, m + 18 * s, m + 40 * s);
  c.font = `400 ${15 * s}px ${MONO}`; c.fillStyle = accS(0.85);
  c.fillText(`ACT ${st.A.num} — ${st.A.title}`, m + 18 * s, m + 66 * s);
  c.font = `300 ${17 * s}px ${CJK}`; c.fillStyle = ink(0.5);
  c.fillText(st.A.cn, m + 18 * s, m + 92 * s);
  const beatF = (t - BEAT0) / BEAT, bar = Math.floor(beatF / 4) + 1, beat = Math.floor(((beatF % 4) + 4) % 4) + 1;
  c.textAlign = 'right';
  c.font = `400 ${20 * s}px ${MONO}`; c.fillStyle = ink(0.86);
  c.fillText(`T+${fmtTime(t)}`, W - m - 18 * s, m + 40 * s);
  c.font = `400 ${15 * s}px ${MONO}`; c.fillStyle = ink(0.5);
  c.fillText(`/ ${fmtTime(DURATION)}`, W - m - 18 * s, m + 66 * s);
  c.fillStyle = accS(0.85);
  c.fillText(`BAR ${String(Math.max(bar, 1)).padStart(2, '0')} · ${beat}/4`, W - m - 18 * s, m + 92 * s);
  for (let k = 0; k < 4; k++) { c.fillStyle = k + 1 === beat ? accS(0.95) : ink(0.18); c.fillRect(W - m - 18 * s - (3 - k) * 14 * s - 8 * s, m + 104 * s, 8 * s, 2 * s); }
  c.textAlign = 'left';
  const ly = m + 128 * s, lx0 = m + 18 * s, lx1 = W - m - 18 * s;
  c.lineWidth = 1 * s;
  c.strokeStyle = ink(0.14); c.beginPath(); c.moveTo(lx0, ly); c.lineTo(lx1, ly); c.stroke();
  c.strokeStyle = ink(0.4); c.beginPath();
  for (const A of ACTS) { const x = lx0 + (A.t0 / DURATION) * (lx1 - lx0); c.moveTo(x, ly - 4 * s); c.lineTo(x, ly + 4 * s); }
  c.stroke();
  c.fillStyle = accS(0.95); c.fillRect(lx0 + (t / DURATION) * (lx1 - lx0) - 1 * s, ly - 6 * s, 2 * s, 12 * s);
}
function hudTelemetry(c, t, st, r) {
  const { s, m, H } = HUD, accS = accent(st);
  const tx = m + 18 * s; let ty = H * 0.618 + 46 * s;
  const rows = [['BASS_RMS', S.bass.toFixed(3)], ['MID_RMS', S.mid.toFixed(3)], ['HIGH_RMS', S.high.toFixed(3)],
    ['PARTICLE_ENTROPY', `${S.entropy.toFixed(3)} bit`], ['N_GRAINS', r.N.toLocaleString('en-US')]];
  c.textAlign = 'left'; c.font = `400 ${14 * s}px ${MONO}`;
  for (const [k, v] of rows) { c.fillStyle = ink(0.42); c.fillText(k, tx, ty); c.fillStyle = ink(0.85); c.fillText(v, tx + 196 * s, ty); ty += 22 * s; }
  const sw = 260 * s, sh = 34 * s, sx = tx, sy = ty + 6 * s;
  c.lineWidth = 1 * s;
  c.strokeStyle = ink(0.14); c.beginPath(); c.moveTo(sx, sy + sh); c.lineTo(sx + sw, sy + sh); c.stroke();
  c.strokeStyle = accS(0.8); c.beginPath();
  const hist = S.bassHist;
  for (let k = 0; k < hist.length; k++) { const x = sx + k / (hist.length - 1) * sw, y = sy + sh - clamp(hist[k] / 1.4, 0, 1) * sh; k ? c.lineTo(x, y) : c.moveTo(x, y); }
  c.stroke();
  const kf = Math.exp(-S.kickAge * 5) * S.kickAmp;
  c.fillStyle = accS(0.25 + 0.75 * Math.min(1, kf)); c.fillRect(sx + sw + 10 * s, sy + sh - 10 * s, 10 * s, 10 * s);
  c.font = `400 ${12 * s}px ${MONO}`; c.fillStyle = ink(0.35);
  const dbfs = 20 * Math.log10(Math.max(1e-6, S.bass * (S.an.ref.bass || 1)));
  c.fillText(`SUB 20–120Hz ${dbfs.toFixed(1)} dBFS · ψ ${st.lt.toFixed(2)}s`, sx, sy + sh + 22 * s);
}
function hudReticle(c) {
  const { s, fx, fy } = HUD;
  c.lineWidth = 1 * s; c.strokeStyle = ink(0.12); c.beginPath();
  c.moveTo(fx - 16 * s, fy); c.lineTo(fx - 6 * s, fy); c.moveTo(fx + 6 * s, fy); c.lineTo(fx + 16 * s, fy);
  c.moveTo(fx, fy - 16 * s); c.lineTo(fx, fy - 6 * s); c.moveTo(fx, fy + 6 * s); c.lineTo(fx, fy + 16 * s); c.stroke();
}
const HUD_DRAW = { header: hudHeader, telemetry: hudTelemetry, reticle: hudReticle };
function updateHUD(t, st, r) {
  gl.bindTexture(gl.TEXTURE_2D, r.hud.tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  if (HUD.dirtyAll) {
    hctx.clearRect(0, 0, hudCanvas.width, hudCanvas.height);
    hudStatic(hctx);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, hudCanvas);
    HUD.dirtyAll = false;
  }
  for (const R of HUD.regions) {
    const c = R.ctx;
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, R.w, R.h); c.translate(-R.x, -R.y);
    HUD_DRAW[R.name](c, t, st, r);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, R.x, HUD.H - R.y - R.h, R.w, R.h, gl.RGBA, gl.UNSIGNED_BYTE, R.cv);
  }
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
}

/* ════════════════════════════ live mode (UI) ════════════════════════════ */
const $ = (id) => document.getElementById(id);
const ui = { intro: $('intro'), bar: $('bar'), play: $('play'), seek: $('seek'), time: $('time'), status: $('status'), toast: $('toast'),
  rec: $('rec'), recRange: $('recRange'), quality: $('quality'), scrub: $('scrubCv'), recTime: $('recTime') };
function toast(msg, ms = 1600) { ui.toast.textContent = msg; ui.toast.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => ui.toast.classList.remove('show'), ms); }
function setStatus(s) { ui.status.textContent = s; }

async function ensureAudioGraph() {
  if (audio.ctx) return;
  audio.ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
  audio.el = new Audio(); audio.el.preload = 'auto'; audio.el.crossOrigin = 'anonymous';
  audio.src = audio.ctx.createMediaElementSource(audio.el);
  audio.analyser = audio.ctx.createAnalyser(); audio.analyser.fftSize = FFT_N; audio.analyser.smoothingTimeConstant = 0;
  audio.analyser.minDecibels = -140; audio.analyser.maxDecibels = 0;
  audio.freq = new Float32Array(audio.analyser.frequencyBinCount);
  audio.dest = audio.ctx.createMediaStreamDestination();
  audio.src.connect(audio.analyser); audio.analyser.connect(audio.ctx.destination); audio.src.connect(audio.dest);
  audio.el.loop = true;
  audio.el.addEventListener('ended', () => { if (REC.active) stopRecording(); else { S.playing = false; updatePlayIcon(); } });
}
async function loadAudioData(arrayBuffer, blobUrl, label) {
  setStatus('DECODING…');
  await ensureAudioGraph();
  const buf = await audio.ctx.decodeAudioData(arrayBuffer.slice(0));
  S.audioBuf = buf;
  S.an = await analyzeBuffer(buf, (p) => setStatus(`ANALYSING SPECTRUM · ${(p * 100).toFixed(0)}%`));
  setStatus(`${label} · ${buf.duration.toFixed(2)}s · ${S.an.kicks.length} KICKS · ${S.an.highs.length} HATS`);
  if (audio.url) URL.revokeObjectURL(audio.url);
  audio.url = blobUrl; audio.el.src = blobUrl;
  S.demo = false; S.ready = true;
  ui.seek.max = buf.duration.toFixed(2);
  drawScrubber();
}
async function loadFile(file) {
  try { const ab = await file.arrayBuffer(); await loadAudioData(ab, URL.createObjectURL(file), file.name.toUpperCase()); startExperience(); }
  catch (e) { setStatus('无法解码该音频 · DECODE FAILED'); console.error(e); }
}
async function tryAutoLoad() {
  const cand = [QS.get('audio'), 'We Never.mp3', '霓虹兔 - We Never.mp3', 'we-never.mp3', 'audio.mp3'].filter(Boolean);
  if (location.protocol === 'file:' && !QS.get('audio')) return false;
  for (const u of cand) {
    try {
      const res = await fetch(u); if (!res.ok) continue;
      const blob = await res.blob(); if (!blob.size || !/audio|octet|mpeg/.test(blob.type || 'audio')) continue;
      await loadAudioData(await blob.arrayBuffer(), URL.createObjectURL(blob), decodeURIComponent(u.split('/').pop()).toUpperCase());
      return true;
    } catch (e) { /* not present next to the page — fine */ }
  }
  return false;
}
function startDemo() {
  S.an = syntheticAnalysis(); S.demo = true; S.ready = true; S.audioBuf = null;
  ui.seek.max = String(DURATION);
  drawScrubber();
  startExperience();
  toast('DEMO · SILENT SYNTHETIC BEAT GRID');
}
function startExperience() {
  ui.intro.classList.add('hidden');
  resetParticles();
  seekTo(0);
  play();
  pokeBar();
}

function curTime() {
  if (S.demo) return S.playing ? clamp((performance.now() / 1000 - S.demoStart) + S.demoOffset, 0, DURATION) : S.demoOffset;
  if (!audio.el) return 0;
  let t = audio.el.currentTime;
  if (!audio.el.paused) {
    const now = performance.now() / 1000;
    if (t !== S.lastMediaT) { S.lastMediaT = t; S.lastMediaWall = now; } else t = S.lastMediaT + (now - S.lastMediaWall);
    if (!REC.active && audio.ctx) t -= (audio.ctx.baseLatency || 0) + (audio.ctx.outputLatency || 0);
  }
  return Math.max(0, t);
}
async function play() {
  if (S.demo) { S.demoStart = performance.now() / 1000; S.playing = true; updatePlayIcon(); return; }
  if (!audio.el) return;
  if (audio.ctx.state === 'suspended') await audio.ctx.resume();
  try { await audio.el.play(); S.playing = true; } catch (e) { toast('点击播放 · TAP TO PLAY'); }
  updatePlayIcon();
}
function pause() {
  if (S.demo) { S.demoOffset = curTime(); S.playing = false; updatePlayIcon(); return; }
  audio.el && audio.el.pause(); S.playing = false; updatePlayIcon();
}
function seekTo(t) {
  t = clamp(t, 0, (S.audioBuf ? S.audioBuf.duration : DURATION) - 0.01);
  if (t < 0.05) resetParticles();
  if (S.demo) { S.demoOffset = t; S.demoStart = performance.now() / 1000; }
  else if (audio.el) audio.el.currentTime = t;
  S.prevT = t; S.prevSimT = t; S.lastMediaT = -1;
}
function updatePlayIcon() { $('playIcon').setAttribute('d', S.playing ? 'M2 1h3v10H2zM7 1h3v10H7z' : 'M2 1l9 5-9 5z'); }

function drawScrubber() {
  const cv = ui.scrub, dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (!w) return;
  cv.width = w * dpr; cv.height = h * dpr;
  const c = cv.getContext('2d'); c.scale(dpr, dpr); c.clearRect(0, 0, w, h);
  const dur = S.audioBuf ? S.audioBuf.duration : DURATION;
  c.fillStyle = 'rgba(226,232,240,0.14)'; c.fillRect(0, h / 2, w, 1);
  if (S.an && S.an.E) {
    const E = S.an.E.bass, n = 180; c.fillStyle = 'rgba(212,175,55,0.35)';
    for (let i = 0; i < n; i++) { const v = clamp(sampleArr(E, S.an.fps, i / n * dur) / S.an.ref.bass, 0, 1.3); const bh = v * h * 0.32; c.fillRect(i / n * w, h / 2 - bh, Math.max(1, w / n - 1), bh * 2); }
  }
  c.fillStyle = 'rgba(226,232,240,0.55)';
  ACTS.forEach((A) => c.fillRect(A.t0 / dur * w, 3, 0.5, h - 6));
  const t = S.t; c.fillStyle = '#f5e6b8'; c.fillRect(t / dur * w - 0.75, 0, 1.5, h);
}

let barTimer = 0;
function pokeBar() { if (RENDER) return; ui.bar.classList.remove('hide'); clearTimeout(barTimer); barTimer = setTimeout(() => { if (S.playing && !ui.bar.matches(':hover')) ui.bar.classList.add('hide'); }, 2600); }

/* ── MediaRecorder export (60 fps canvas + WebAudio track) ── */
const REC = { active: false, rec: null, chunks: [], end: 0, mime: '' };
function pickMime() {
  const c = ['video/mp4;codecs=avc1.640033,mp4a.40.2', 'video/mp4;codecs=avc1.4d0033,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4',
    'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  return c.find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
}
async function startRecording() {
  if (REC.active) return stopRecording();
  if (!S.ready) return toast('请先加载音频 · LOAD AUDIO FIRST');
  if (!window.MediaRecorder) return toast('此浏览器不支持 MediaRecorder');
  const cut = ui.recRange.value === 'cut';
  const t0 = cut ? 9.04 : 0, t1 = cut ? 45.04 : (S.audioBuf ? S.audioBuf.duration : DURATION);
  pause();
  // pre-roll so the particle field is in its choreographed state at the first recorded frame
  resetParticles();
  if (t0 > 0) preroll(Math.max(0, t0 - 4), t0);
  seekTo(t0);
  const stream = new MediaStream([...canvas.captureStream(60).getVideoTracks(), ...(!S.demo && audio.dest ? audio.dest.stream.getAudioTracks() : [])]);
  REC.mime = pickMime();
  REC.rec = new MediaRecorder(stream, { mimeType: REC.mime || undefined, videoBitsPerSecond: 40_000_000, audioBitsPerSecond: 320_000 });
  REC.chunks = []; REC.end = t1; REC.t0 = t0;
  REC.rec.ondataavailable = (e) => { if (e.data && e.data.size) REC.chunks.push(e.data); };
  REC.rec.onstop = () => {
    const type = REC.rec.mimeType || REC.mime || 'video/webm';
    const blob = new Blob(REC.chunks, { type });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `WeNever_${cut ? 'douyin-cut_09-45' : 'full'}_1080x1920_60fps.${type.includes('mp4') ? 'mp4' : 'webm'}`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    toast(`已导出 · SAVED ${(blob.size / 1048576).toFixed(1)} MB`, 2600);
  };
  REC.active = true; document.body.classList.add('recording'); ui.rec.classList.add('on'); ui.rec.textContent = '■ STOP';
  REC.rec.start(1000);
  await play();
}
function stopRecording() {
  if (!REC.active) return;
  REC.active = false; document.body.classList.remove('recording'); ui.rec.classList.remove('on'); ui.rec.textContent = '● REC 60FPS';
  try { REC.rec.stop(); } catch (e) { console.error(e); }
  pause();
}
function preroll(fromT, toT) {
  const dt = 1 / 30; let t = fromT;
  S.prevT = t; S.prevSimT = t;
  while (t < toT) { const nt = Math.min(toT, t + dt); renderFrame(nt, nt - t, false); t = nt; }
}

function liveLoop() {
  requestAnimationFrame(liveLoop);
  if (!S.ready || !G.res) return;
  const t = curTime();
  let dt = S.playing ? t - S.prevT : 0;
  if (dt < 0 || dt > 0.5) { dt = S.playing ? 1 / 60 : 0; S.prevSimT = t - dt; }
  dt = Math.min(dt, 1 / 15);
  S.t = t;
  renderFrame(t, dt, true);
  S.prevT = t;
  if (S.demo && S.playing && t >= DURATION - 0.01) { resetParticles(); seekTo(0); S.demoStart = performance.now() / 1000; }
  if (REC.active) { ui.recTime.textContent = `REC ${fmtTime(t - REC.t0)}`; if (t >= REC.end - 0.02) stopRecording(); }
  if (!ui.bar.classList.contains('hide')) { ui.time.textContent = fmtTime(t); if (document.activeElement !== ui.seek) ui.seek.value = t.toFixed(2); drawScrubber(); }
}

function bindUI() {
  const drop = $('drop'), file = $('file');
  $('pick').onclick = () => file.click();
  $('loadBtn').onclick = () => file.click();
  file.onchange = () => file.files[0] && loadFile(file.files[0]);
  $('demo').onclick = startDemo;
  ['dragenter', 'dragover'].forEach((ev) => window.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((ev) => window.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
  window.addEventListener('drop', (e) => { const f = e.dataTransfer.files[0]; if (f) loadFile(f); });
  ui.play.onclick = () => (S.playing ? pause() : play());
  ui.seek.oninput = () => { seekTo(parseFloat(ui.seek.value)); };
  $('hudBtn').onclick = toggleClean;
  $('fsBtn').onclick = toggleFS;
  ui.rec.onclick = startRecording;
  ui.quality.onchange = () => { try { buildResources(ui.quality.value); resetParticles(); toast(`QUALITY · ${ui.quality.value.toUpperCase()} · ${G.res.N.toLocaleString('en-US')} GRAINS`); } catch (e) { fatal(String(e)); } };
  window.addEventListener('mousemove', pokeBar); window.addEventListener('touchstart', pokeBar, { passive: true });
  window.addEventListener('resize', drawScrubber);
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
    const k = e.key.toLowerCase();
    if (k === ' ') { e.preventDefault(); S.playing ? pause() : play(); }
    else if (k === 'h') toggleClean();
    else if (k === 'f') toggleFS();
    else if (k === 'r') startRecording();
    else if (k === 'arrowright') seekTo(S.t + 5);
    else if (k === 'arrowleft') seekTo(S.t - 5);
    else if (k >= '1' && k <= '8') { const A = ACTS[+k - 1]; seekTo(Math.max(0, A.t0 - (A.t0 > 0 ? 1.5 : 0))); }
    pokeBar();
  });
}
function toggleClean() {
  S.hudOn = !S.hudOn; HUD.dirtyAll = true;
  document.body.classList.toggle('clean', !S.hudOn);
  toast(S.hudOn ? 'HUD ON' : 'CLEAN MODE · 按 H 恢复');
}
function toggleFS() { const v = $('view'); if (!document.fullscreenElement) (v.requestFullscreen || v.webkitRequestFullscreen).call(v); else document.exitFullscreen(); }

/* ════════════════════════ offline frame-exact renderer ════════════════════════
   index.html?render=1&audio=URL&from=0&to=102.48&fps=60&q=high&hud=1&post=/frame
   Every frame is simulated at an exact 1/fps step, read back and POSTed as raw RGBA. */
async function runOffline() {
  document.body.classList.add('render');
  const fps = parseFloat(QS.get('fps') || '60'), from = parseFloat(QS.get('from') || '0');
  const post = QS.get('post') || '/frame';
  const pre = parseFloat(QS.get('preroll') || (from > 0 ? '4' : '0'));
  if (QS.get('audio')) {
    const res = await fetch(QS.get('audio'));
    const ab = await res.arrayBuffer();
    const ctx = new OfflineAudioContext(2, 44100, 44100);
    S.audioBuf = await ctx.decodeAudioData(ab);
    S.an = await analyzeBuffer(S.audioBuf, null);
  } else { S.an = syntheticAnalysis(); S.demo = true; }
  const to = parseFloat(QS.get('to') || String(S.audioBuf ? S.audioBuf.duration : DURATION));
  S.ready = true;
  resetParticles();
  const W = G.res.W, H = G.res.H, px = new Uint8Array(W * H * 3 / 2);
  if (pre > 0) preroll(Math.max(0, from - pre), from);
  const n = Math.round((to - from) * fps);
  let tPrev = from; S.prevT = from; S.prevSimT = from;
  const t0 = performance.now();
  console.log(`[render] ${n} frames ${W}x${H} @${fps}fps from ${from}s, ${G.res.N} particles`);
  const prof = { render: 0, read: 0, post: 0 };
  let inflight = null;
  for (let i = 0; i < n; i++) {
    const t = from + (i + 1) / fps;
    S.t = t;
    const a = performance.now();
    renderFrame(t, t - tPrev, false);
    tPrev = t;
    target(G.res.yuvF);
    use(G.progs.yuv, { uSrc: G.res.final, uSize: [W, H] });
    quad();
    const b = performance.now();
    gl.readPixels(0, 0, W >> 2, H * 3 >> 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    const c = performance.now();
    if (inflight) { const r = await inflight; if (!r.ok) throw new Error('frame sink refused frame ' + (i - 1)); }
    inflight = fetch(`${post}?i=${i}`, { method: 'POST', body: px });   // body bytes are copied at call time
    const d = performance.now();
    prof.render += b - a; prof.read += c - b; prof.post += d - c;
    if (i % 30 === 29 || i === n - 1) {
      const k = (i % 30) + 1;
      console.log(`[render] frame ${i + 1}/${n} t=${t.toFixed(2)}s  ${((performance.now() - t0) / (i + 1)).toFixed(0)}ms/f  (cpu ${(prof.render / k).toFixed(0)} · gpu+read ${(prof.read / k).toFixed(0)} · sink wait ${(prof.post / k).toFixed(0)})`);
      prof.render = prof.read = prof.post = 0;
    }
  }
  if (inflight) await inflight;
  await fetch(`${post}?done=1`, { method: 'POST' });
  window.__WN_DONE = true;
  console.log('[render] done');
}

/* ════════════════════════════════ boot ════════════════════════════════ */
(async function boot() {
  if (!gl || window.__WN_ERROR) return;
  try {
    buildPrograms();
    const q = QS.get('q') && QUALITY[QS.get('q')] ? QS.get('q') : 'high';
    ui.quality.value = q;
    buildResources(q);
  } catch (e) { fatal('Shader / GPU init failed:\n' + e.message); return; }
  if (RENDER && QS.has('bench')) { window.__WN_READY = true; return; }
  if (RENDER) { runOffline().catch((e) => { fatal(String(e && e.stack || e)); }); return; }
  bindUI();
  requestAnimationFrame(liveLoop);
  if (await tryAutoLoad()) { setStatus('点击任意处开始 · CLICK TO START'); const go = () => { window.removeEventListener('pointerdown', go); startExperience(); }; window.addEventListener('pointerdown', go); }
})();
